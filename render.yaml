services:
  - type: web
    name: cafeloop
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TWILIO_AUTOMATIONS_ENABLED
        value: "false"
